image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/lizee.png
name: Lizee
description: >-
  Lizee is a Paris-based Retail-as-a-Service platform that helps brands and
  retailers launch and operate circular commerce programs — rental, resale, and
  second-hand — end to end. Its stack pairs a rental platform, a resale/e-commerce
  platform, and a logistics platform (returns, refurbishment, reverse logistics)
  behind an operations API so a brand can offer rent or buy-back experiences on top
  of its existing catalog. Lizee runs a production API (api.lizee.io) and publishes a
  public Atlassian Statuspage, though it does not expose a public developer portal,
  OpenAPI definition, or SDKs — the API surface is partner and integration facing.
  Lizee was added to the API Evangelist network as a portfolio company of Speedinvest.
